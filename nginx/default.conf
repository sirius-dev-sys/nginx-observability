server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # метрики для nginx_exporter
    location = /nginx_status {
        stub_status;
    }
}
